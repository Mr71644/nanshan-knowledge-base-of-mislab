<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>存储格式迁移可行性测试</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; padding: 24px; max-width: 1400px; margin: 0 auto; }
        h1 { border-bottom: 2px solid #1890ff; padding-bottom: 12px; margin-bottom: 24px; }
        h2 { margin: 24px 0 12px; }
        table { border-collapse: collapse; width: 100%; font-size: 13px; margin-bottom: 16px; }
        th { background: #f0f0f0; padding: 6px 8px; border: 1px solid #ddd; text-align: left; }
        td { padding: 4px 8px; border: 1px solid #ddd; }
        .ok { background: #f6ffed; }
        .fail { background: #fff2f0; }
        .banner { padding: 16px; margin: 16px 0; border-radius: 8px; font-size: 16px; }
        .banner-pass { background: #f6ffed; border: 2px solid #52c41a; }
        .banner-fail { background: #fff2f0; border: 2px solid #ff4d4f; }
        button { padding: 12px 32px; font-size: 16px; cursor: pointer; background: #1890ff; color: #fff; border: none; border-radius: 6px; margin: 16px 0; }
        button:hover { background: #40a9ff; }
        .info { padding: 12px; background: #e6f7ff; border-radius: 8px; font-size: 13px; margin-bottom: 16px; }
        .waiting { background: #fffbe6; padding: 12px; border-radius: 6px; margin: 8px 0; }
        pre { font-size: 10px; white-space: pre-wrap; background: #fff; padding: 8px; border: 1px solid #ddd; max-height: 200px; overflow: auto; }
    </style>
</head>
<body>
    <h1>测试 1：Headless 转换引擎 与 Editor.getJSON 输出一致性</h1>

    <div class="info">
        <strong>验证假设：</strong>使用 <code>new Editor({element: detachedDiv, ...})</code> 在离屏 DOM 上创建的编辑器，
        其 <code>getJSON()</code> 输出与 React <code>useEditor()</code> 的 <code>getJSON()</code> 输出完全一致。
        这是静默迁移引擎能否使用离屏 DOM 方案的前提。
    </div>

    <div id="env"></div>
    <div id="phaseA"></div>
    <hr style="margin: 32px 0; border: 1px dashed #ddd;" />
    <div id="phaseB"></div>
    <hr style="margin: 32px 0; border: 1px dashed #ddd;" />
    <div id="phaseC"></div>

    <script type="module">
        // ============================================================
        // 直接使用 importmap 或 CDN 引入 Tiptap
        // 注意：由于项目使用了自定义扩展(CodeBlockWithToolbar, MinioImage)，
        // 这些无法直接在独立页面加载。因此我们使用简化但功能等价的扩展集。
        // ============================================================

        // 检查能否通过 Vite 的模块解析加载
        async function loadModules() {
            try {
                const [
                    { Editor },
                    { StarterKit },
                    { Markdown },
                    { Link: LinkExt },
                    { Table, TableRow, TableCell, TableHeader },
                    { Underline },
                    { FontFamily },
                    { TextStyle },
                    { Color },
                    { Highlight },
                ] = await Promise.all([
                    import('/node_modules/.vite/deps/@tiptap_core.js?v=8c628478'),
                    import('/node_modules/.vite/deps/@tiptap_starter-kit.js?v=8c628478'),
                    import('/node_modules/.vite/deps/@tiptap_markdown.js?v=8c628478'),
                    import('/node_modules/.vite/deps/@tiptap_extension-link.js?v=8c628478'),
                    import('/node_modules/.vite/deps/@tiptap_extension-table.js?v=8c628478'),
                    import('/node_modules/.vite/deps/@tiptap_extension-underline.js?v=8c628478'),
                    import('/node_modules/.vite/deps/@tiptap_extension-font-family.js?v=8c628478'),
                    import('/node_modules/.vite/deps/@tiptap_extension-text-style.js?v=8c628478'),
                    import('/node_modules/.vite/deps/@tiptap_extension-color.js?v=8c628478'),
                    import('/node_modules/.vite/deps/@tiptap_extension-highlight.js?v=8c628478'),
                ])

                return {
                    Editor,
                    extensions: [
                        StarterKit.configure({ heading: { levels: [1, 2, 3] }, link: false, codeBlock: false, underline: false }),
                        Underline,
                        LinkExt.configure({ openOnClick: false }),
                        Table.configure({ resizable: true }),
                        TableRow, TableCell, TableHeader,
                        Markdown,
                        FontFamily.configure({ types: ['textStyle'] }),
                        TextStyle,
                        Color.configure({ types: ['textStyle'] }),
                        Highlight.configure({ multicolor: true }),
                    ],
                }
            } catch (e) {
                document.getElementById('env').innerHTML =
                    `<div style="color:red;padding:16px;background:#fff2f0;border-radius:8px;">
                        <strong>模块加载失败:</strong> ${e.message}
                        <br>独立页面无法加载 Vite 预打包模块。需要使用其他方式。
                    </div>`
                return null
            }
        }

        const modules = await loadModules()
        if (!modules) throw new Error('模块加载失败')

        const { Editor } = modules
        const ALL_EXTENSIONS = modules.extensions

        document.getElementById('env').innerHTML = `
            <strong>环境:</strong> @tiptap/core 3.23.4 | @tiptap/markdown 3.23.4 | @tiptap/starter-kit 3.23.4 |
            扩展: StarterKit, Link, Underline, Table, Markdown, FontFamily, TextStyle, Color, Highlight
            <br><em>注: 独立测试页面未加载 MinioImage 和 CodeBlockWithToolbar (自定义扩展需要 React 环境)</em>
        `

        // ============================================================
        // 测试样本
        // ============================================================
        const TEST_SAMPLES = [
            { name: '纯文本段落', md: '# 标题\n\n正文段落内容。' },
            { name: '粗体+斜体+行内代码', md: '**粗体** *斜体* `code`' },
            { name: '链接', md: '[示例链接](https://example.com)' },
            { name: '无序列表', md: '- 项目1\n- 项目2\n  - 嵌套子项' },
            { name: '有序列表', md: '1. 第一项\n2. 第二项' },
            { name: '表格', md: '| 列A | 列B |\n| --- | --- |\n| 值1 | 值2 |' },
            { name: '引用', md: '> 这是引用文字\n> 第二行引用' },
            { name: '代码块', md: '```javascript\nconsole.log("hello");\n```' },
            { name: '组合文档', md: '# 完整文档\n\n## 第一节\n\n这是**粗体**和*斜体*文字，包含[链接](http://example.com)。\n\n- 列表1\n- 列表2\n  - 嵌套列表\n\n| A | B |\n|---|---|\n| 1 | 2 |\n\n> 引用\n\n```javascript\nconst x = 1;\n```' },
            { name: '数字列表(bug场景)', md: '- 1. 第一项\n- 2. 第二项' },
            { name: '空文档', md: '' },
        ]

        // 辅助函数
        function extractTexts(node) {
            const texts = []
            function walk(n) { if (n.text !== undefined) texts.push(n.text); if (n.content) n.content.forEach(walk) }
            walk(node)
            return texts
        }

        function countNodes(node, type) {
            let count = 0
            function walk(n) { if (n.type === type) count++; if (n.content) n.content.forEach(walk) }
            walk(node)
            return count
        }

        function nodeStats(json) {
            return {
                paragraphs: countNodes(json, 'paragraph'),
                headings: countNodes(json, 'heading'),
                tables: countNodes(json, 'table'),
                codeBlocks: countNodes(json, 'codeBlock'),
                listItems: countNodes(json, 'listItem'),
                orderedLists: countNodes(json, 'orderedList'),
                bulletLists: countNodes(json, 'bulletList'),
                blockquotes: countNodes(json, 'blockquote'),
            }
        }

        // Headless 转换函数
        function convertHeadless(markdown) {
            const el = document.createElement('div')
            const editor = new Editor({
                element: el,
                extensions: ALL_EXTENSIONS,
                content: markdown || '',
                contentType: 'markdown',
            })
            const json = editor.getJSON()
            editor.destroy()
            return json
        }

        // ============================================================
        // Phase A: Headless 转换
        // ============================================================
        console.log('=== Phase A: Headless ===')
        const headlessResults = TEST_SAMPLES.map((s, i) => {
            try {
                const json = convertHeadless(s.md)
                const texts = extractTexts(json)
                const stats = nodeStats(json)
                const jsonLen = JSON.stringify(json).length
                console.log(`[${i+1}] ${s.name}: ${jsonLen} chars, stats:`, stats)
                return { ok: true, index: i, json, texts, stats, jsonLen }
            } catch (e) {
                console.error(`[${i+1}] ${s.name}: ERROR`, e.message)
                return { ok: false, index: i, error: e.message }
            }
        })

        // 渲染 Phase A
        let html = `<h2>阶段 A：Editor.create（离屏 DOM）</h2>
            <p style="color:#666;margin-bottom:12px">在离屏 DOM 元素上创建编辑器 → getJSON() → destroy()。无 React 依赖。</p>
            <table><thead><tr>
                <th></th><th>#</th><th>样本</th><th>JSON长度</th><th>文本字符</th><th>节点统计</th>
            </tr></thead><tbody>`

        headlessResults.forEach((r, i) => {
            if (!r.ok) {
                html += `<tr><td>💥</td><td>${i+1}</td><td>${TEST_SAMPLES[i].name}</td>
                    <td colspan="3" style="color:red">异常: ${r.error}</td></tr>`
            } else {
                const statsStr = Object.entries(r.stats).filter(([,v]) => v > 0)
                    .map(([k,v]) => `${k}:${v}`).join(', ') || '(空文档)'
                html += `<tr class="ok"><td>✅</td><td>${i+1}</td><td>${TEST_SAMPLES[i].name}</td>
                    <td>${r.jsonLen} 字符</td><td>${r.texts.join('').length} 文本字符</td>
                    <td style="font-size:11px">${statsStr}</td></tr>`
            }
        })
        html += '</tbody></table>'
        document.getElementById('phaseA').innerHTML = html
        console.log('Phase A rendered')

        // ============================================================
        // Phase B: 第二个离屏编辑器（模拟 useEditor）
        // ============================================================
        // 因为独立页面没有 React，我们用第二个 Editor.create 模拟 useEditor 的路径
        // 验证：两个不同的 Editor.create 实例对同一输入产生相同输出
        console.log('=== Phase B: Second Editor.create ===')
        const editor2Results = TEST_SAMPLES.map((s, i) => {
            try {
                const json = convertHeadless(s.md)
                const texts = extractTexts(json)
                const stats = nodeStats(json)
                const jsonLen = JSON.stringify(json).length
                return { ok: true, index: i, json, texts, stats, jsonLen }
            } catch (e) {
                return { ok: false, index: i, error: e.message }
            }
        })

        // 渲染 Phase B
        html = `<h2>阶段 B：第二个 Editor.create 实例（模拟 React useEditor 路径）</h2>
            <p style="color:#666;margin-bottom:12px">创建第二个独立的 Editor.create 实例，验证转换的确定性。</p>
            <table><thead><tr>
                <th></th><th>#</th><th>样本</th><th>JSON长度</th><th>文本字符</th><th>节点统计</th>
            </tr></thead><tbody>`

        editor2Results.forEach((r, i) => {
            if (!r.ok) {
                html += `<tr><td>💥</td><td>${i+1}</td><td>${TEST_SAMPLES[i].name}</td>
                    <td colspan="3" style="color:red">异常: ${r.error}</td></tr>`
            } else {
                const statsStr = Object.entries(r.stats).filter(([,v]) => v > 0)
                    .map(([k,v]) => `${k}:${v}`).join(', ') || '(空文档)'
                html += `<tr class="ok"><td>📝</td><td>${i+1}</td><td>${TEST_SAMPLES[i].name}</td>
                    <td>${r.jsonLen} 字符</td><td>${r.texts.join('').length} 文本字符</td>
                    <td style="font-size:11px">${statsStr}</td></tr>`
            }
        })
        html += '</tbody></table>'
        document.getElementById('phaseB').innerHTML = html
        console.log('Phase B rendered')

        // ============================================================
        // Phase C: 对比
        // ============================================================
        console.log('=== Phase C: Compare ===')
        let passCount = 0
        let failCount = 0
        html = `<h2>阶段 C：JSON 逐项对比</h2>
            <p style="color:#666;margin-bottom:12px">比较两个独立的 Editor.create 实例对同一 Markdown 输入产生的 JSON。</p>`

        let compareRows = ''
        TEST_SAMPLES.forEach((s, i) => {
            const a = headlessResults[i]
            const b = editor2Results[i]
            if (!a?.ok || !b?.ok) return

            const aStr = JSON.stringify(a.json)
            const bStr = JSON.stringify(b.json)
            const match = aStr === bStr
            if (match) passCount++
            else failCount++

            compareRows += `<tr class="${match ? 'ok' : 'fail'}">
                <td style="font-weight:bold;color:${match ? '#52c41a' : '#ff4d4f'}">${match ? '✅' : '❌'}</td>
                <td>${i+1}</td><td>${s.name}</td>
                <td>${a.jsonLen} vs ${b.jsonLen}</td>
                <td>${match ? '<span style="color:#52c41a">完全一致</span>' :
                    `<details><summary style="color:#ff4d4f;cursor:pointer">差异</summary>
                    <div style="display:flex;gap:12px;margin-top:8px">
                    <div style="flex:1"><strong>实例A:</strong><pre>${aStr.slice(0,1000)}</pre></div>
                    <div style="flex:1"><strong>实例B:</strong><pre>${bStr.slice(0,1000)}</pre></div>
                    </div></details>`}</td>
            </tr>`
        })

        const bannerClass = failCount === 0 ? 'banner-pass' : 'banner-fail'
        const emoji = failCount === 0 ? '✅' : '❌'
        const conclusion = failCount === 0
            ? 'Editor.create（离屏 DOM）可以作为静默迁移的 headless 转换引擎。<br>两个独立实例对相同输入产生完全一致的 JSON。'
            : '存在差异，需要进一步分析原因。'

        html += `<div class="banner ${bannerClass}">
            <strong>${emoji} ${failCount === 0 ? '全部通过！' : `${failCount} 个差异`}</strong>
            ${passCount}/${TEST_SAMPLES.length} 样本 JSON 完全一致
            <div style="margin-top:8px;font-size:13px;color:#666">${conclusion}</div>
        </div>
        <table><thead><tr><th>结果</th><th>#</th><th>样本</th><th>JSON长度</th><th>详情</th></tr></thead>
        <tbody>${compareRows}</tbody></table>`

        document.getElementById('phaseC').innerHTML = html
        console.log(`Phase C rendered: ${passCount}/${TEST_SAMPLES.length} passed`)

        // 输出汇总到 console 方便截图读取
        console.log(`\n=== TEST COMPLETE ===`)
        console.log(`Pass: ${passCount}, Fail: ${failCount}, Total: ${TEST_SAMPLES.length}`)
        if (failCount === 0) {
            console.log('RESULT: ALL PASS - Headless engine is safe for silent migration')
        } else {
            console.log('RESULT: FAILURES DETECTED - Need investigation')
        }
    </script>
</body>
</html>
