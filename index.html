<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title></title>
  <style>
    #app-loading {
      position: fixed;
      top: 0; left: 0;
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #ffffff;
      z-index: 9999;
      transition: opacity 0.3s ease;
    }
    #app-loading.fade-out {
      opacity: 0;
      pointer-events: none;
    }
    .app-spinner {
      width: 32px;
      height: 32px;
      position: relative;
      animation: app-spin-rotate 1.2s linear infinite;
    }
    .app-spinner i {
      position: absolute;
      display: block;
      width: 8px;
      height: 8px;
      background: #d4a84c;
      border-radius: 50%;
      opacity: 0.3;
      animation: app-spin-dot 1.2s ease-in-out infinite alternate;
    }
    .app-spinner i:nth-child(1) { top: 0; left: 50%; margin-left: -4px; animation-delay: 0s; }
    .app-spinner i:nth-child(2) { top: 50%; right: 0; margin-top: -4px; animation-delay: 0.3s; }
    .app-spinner i:nth-child(3) { bottom: 0; left: 50%; margin-left: -4px; animation-delay: 0.6s; }
    .app-spinner i:nth-child(4) { top: 50%; left: 0; margin-top: -4px; animation-delay: 0.9s; }
    @keyframes app-spin-rotate {
      to { transform: rotate(360deg); }
    }
    @keyframes app-spin-dot {
      0%   { opacity: 0.2; transform: scale(0.75); }
      100% { opacity: 1;   transform: scale(1); }
    }
  </style>
</head>

<body>
  <div id="app-loading"><div class="app-spinner"><i></i><i></i><i></i><i></i></div></div>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
